name: CI

on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:
    branches: [main, dev, 'release/**']

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Frontend lint
        run: |
          cd web
          npm ci
          npx eslint src/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - name: Run tests
        run: go test -race -count=1 -timeout=20m -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  sandbox:
    name: Sandbox E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      # A real Caddy turns on the sandbox's real-proxy checks: the dry agent's
      # rendered config goes through `caddy validate`, and the live test serves
      # real HTTP/TLS through Caddy on loopback ports. Pinned and checksummed.
      - name: Install Caddy
        env:
          CADDY_VERSION: 2.11.7
          CADDY_SHA512: a7a433a1b133efc3c8d10eb0b99d52a24b5ef5c322dc77f5282182b1c0402139ab83f3a99f0c52409df77d20123fb0b523edad8a66d8f5e49136197bf61ef0e7
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/caddy"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/caddy.tar.gz" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          echo "${CADDY_SHA512}  $dir/caddy.tar.gz" | sha512sum -c -
          tar -xzf "$dir/caddy.tar.gz" -C "$dir" caddy
          "$dir/caddy" version
          echo "NP_SANDBOX_CADDY=$dir/caddy" >> "$GITHUB_ENV"
      - name: Sandbox end-to-end (dry control plane + real-proxy checks + live Caddy)
        env:
          # nginx -t runs from the nginx image when no local nginx is installed.
          NP_SANDBOX_DOCKER: '1'
        run: go test -count=1 -tags=sandbox -timeout=480s -v ./test/sandbox/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        run: cd web && npm ci && npm run build
      - name: Frontend unit tests
        run: cd web && npm test
      - name: Build orchestrator
        run: go build -o nurproxy ./cmd/nurproxy
      - name: Build agent
        run: go build -o nurproxy-agent ./cmd/nurproxy-agent
      - name: Cross-build release matrix
        run: make build-release-matrix
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            nurproxy
            nurproxy-agent
